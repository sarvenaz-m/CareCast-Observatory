[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carecast-observatory"
version = "1.0.0"
description = "Reproducible time-varying forecasts of hospital and intensive-care occupancy"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3"]

[project.scripts]
carecast = "carecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
